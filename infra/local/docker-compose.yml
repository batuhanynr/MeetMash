services:
  postgres:
    image: postgres:16
    container_name: meetmesh-postgres
    environment:
      POSTGRES_USER: meetmesh
      POSTGRES_PASSWORD: meetmesh
      POSTGRES_DB: meetmesh
    ports:
      - "5433:5432"
    volumes:
      - meetmesh-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetmesh -d meetmesh"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  meetmesh-pgdata:
