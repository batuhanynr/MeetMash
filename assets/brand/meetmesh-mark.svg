<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1254 1254" role="img" aria-label="MeetMesh — three connected AI agents coordinating a meeting">
<title>MeetMesh app icon</title>

<g  fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- orbital links: distributed agents communicating as one group -->
  <path d="M 422 439 C 330 503 284 595 285 703" stroke="#0B2147" stroke-width="45"/>
  <path d="M 823 439 C 913 500 958 589 959 702" stroke="#0B2147" stroke-width="45"/>
  <path d="M 472 971 C 568 1029 679 1035 775 971" stroke="#0B2147" stroke-width="45"/>

  <!-- connections from each agent to the central shared calendar -->
  <path d="M 624 466 L 624 566" stroke="#0B2147" stroke-width="38" stroke-linecap="butt"/>
  <path d="M 426 819 L 485 778" stroke="#0B2147" stroke-width="40" stroke-linecap="butt"/>
  <path d="M 762 777 L 825 820" stroke="#0B2147" stroke-width="40" stroke-linecap="butt"/>

  <!-- calendar body, visually prominent; rounded corners and balanced stroke weights -->
  <rect x="492" y="604" width="264" height="220" rx="43" stroke="#0B2147" stroke-width="35"/>
  <path d="M 562 579 L 562 629 M 688 579 L 688 629" stroke="#0B2147" stroke-width="37"/>
  <path d="M 576 719 L 616 755 L 680 689" stroke="#6231F4" stroke-width="36"/>

  <!-- three distinct personal AI agents; plain geometry for small-size clarity -->
  <rect x="478" y="246" width="292" height="208" rx="104" stroke="#0967F7" stroke-width="60"/>
  <rect x="563" y="322" width="31" height="56" rx="16" fill="#0B2147"/>
  <rect x="655" y="322" width="31" height="56" rx="16" fill="#0B2147"/>

  <rect x="184" y="779" width="250" height="191" rx="95" stroke="#6231F4" stroke-width="57"/>
  <rect x="258" y="848" width="29" height="52" rx="15" fill="#0B2147"/>
  <rect x="335" y="848" width="29" height="52" rx="15" fill="#0B2147"/>

  <rect x="814" y="779" width="250" height="191" rx="95" stroke="#02BCAF" stroke-width="57"/>
  <rect x="885" y="848" width="29" height="52" rx="15" fill="#0B2147"/>
  <rect x="962" y="848" width="29" height="52" rx="15" fill="#0B2147"/>
</g>
</svg>