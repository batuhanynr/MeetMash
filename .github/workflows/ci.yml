name: CI checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  protocol-and-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:gate:m1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-evidence
          path: .state/evidence/m1/
          include-hidden-files: true
  hub-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meetmesh
          POSTGRES_PASSWORD: meetmesh
          POSTGRES_DB: meetmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meetmesh -d meetmesh"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run certs
      - run: npm run secrets
      - run: npm run test:hub
        env:
          DATABASE_URL: postgres://meetmesh:meetmesh@127.0.0.1:5432/meetmesh
      - run: npm run demo:m2
        env:
          DATABASE_URL: postgres://meetmesh:meetmesh@127.0.0.1:5432/meetmesh
  flutter-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: npm run check:mobile
