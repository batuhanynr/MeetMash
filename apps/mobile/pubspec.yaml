name: meetmesh
description: Personal agents for private meeting scheduling.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  intl: ^0.20.2
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^6.3.0
  json_schema: ^5.2.2
  meetmesh_protocol:
    path: ../../packages/protocol
  http: 1.6.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/meetmesh-mark.png
